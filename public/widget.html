<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #fcfdff;
      --text: #1f2937;
      --border: rgba(31, 41, 55, 0.12);
      --primary: #4a5fb7;
      --accent: #3f51b5;
      --muted-text: rgba(31, 41, 55, 0.72);
    }

    html {
      height: 100%;
    }
    
    body {
      height: 100%;
    }
    html.dark {
      --bg: #141823;
      --card: #1a1f2c;
      --text: #e8ecf4;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #91a8e4;
      --muted-text: rgba(232, 236, 244, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--card);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: relative;
    }

    .tab-button {
      flex: 1;
      padding: 0.85rem 0.5rem;
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--muted-text);
      cursor: pointer;
      transition: color 0.2s;
    }

    .tab-button.active {
      color: var(--text);
      border-bottom: 2px solid var(--border);
      cursor: default;
      pointer-events: none;
    }

    .tab-bar.single-tab .tab-button.active {
      border-bottom: none;
    }

    .tab-panel {
      padding: 1rem 1.25rem;
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-panel.active {
      display: flex;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 0.75rem;
      max-height: 100%;
    }

    .tab-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      position: relative;
    }

    #more-actions {
      background: transparent;
      border: none;
      color: var(--muted-text);
      font-size: 1.6rem;
      cursor: pointer;
      padding: 0 0.65rem;
    }

    .more-menu {
      position: absolute;
      top: 120%;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      display: none;
      flex-direction: column;
      min-width: 140px;
      z-index: 10;
    }

    .more-menu button {
      border: none;
      background: transparent;
      padding: 0.65rem 1rem;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .more-menu button:hover {
      background: rgba(63, 81, 181, 0.08);
    }

    .msg {
      padding: 0.65rem 0.9rem;
      border-radius: 0.9rem;
      max-width: 88%;
      font-size: 0.92rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(63, 81, 181, 0.12);
      color: var(--text);
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(127, 140, 170, 0.12);
      border: 1px solid var(--border);
      color: var(--text);
    }

    form {
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
      margin-top: 0.5rem;
    }

    input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
    }

    button[type="submit"] {
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      padding: 0 1.1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.35rem;
      margin: 0.45rem 0;
    }

    .preset-row button {
      border-radius: 0.6rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.84rem;
      cursor: pointer;
      padding: 0.45rem 0.6rem;
    }

    #links-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: block;
      padding: 0.9rem;
      border-radius: 0.9rem;
      border: 1px solid var(--border);
      text-decoration: none;
      background: rgba(63, 81, 181, 0.06);
      color: var(--text);
      transition: border-color 0.2s, transform 0.2s;
    }

    .link-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .link-card h4 {
      margin: 0;
      font-size: 0.95rem;
    }

    .link-card p {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      color: var(--muted-text);
    }

    .info-headline {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .info-summary {
      margin: 0.35rem 0 1rem;
      color: var(--muted-text);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .info-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
    }

    .info-stat {
      padding: 0.75rem;
      border-radius: 0.8rem;
      border: 1px solid var(--border);
      background: rgba(63, 81, 181, 0.06);
    }

    .info-stat strong {
      display: block;
      font-size: 1rem;
    }

    .loading-spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 0.4rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="tab-bar">
    <button class="tab-button active" id="chat-tab-button" data-tab="chat">Chat Widget</button>
    <button class="tab-button" data-tab="links">Quick links</button>
    <button class="tab-button" data-tab="info">More</button>
    <div class="tab-actions">
      <button id="more-actions" type="button" aria-label="More actions">⋯</button>
      <div id="more-menu" class="more-menu">
        <button type="button" id="menu-fullpage">Toggle full page</button>
      </div>
    </div>
  </div>

  <section id="chat-tab" class="tab-panel active">
    <div id="chat"></div>
    <div id="welcome-preset" style="margin-top:0.5rem;"></div>
    <form id="form">
      <input type="text" id="input" autocomplete="off" placeholder="Ask something..." />
      <button type="submit">Send</button>
    </form>
  </section>

  <section id="links-tab" class="tab-panel">
    <div id="links-list"></div>
  </section>

    <section id="info-tab" class="tab-panel">
      <h3 class="info-headline" id="info-headline">Built for modern teams</h3>
      <p class="info-summary" id="info-summary">Share context, policies, or offers right next to chat so visitors get just-in-time help.</p>
      <div class="info-stats" id="info-stats"></div>
    </section>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const linksList = document.getElementById('links-list');
    const infoHeadline = document.getElementById('info-headline');
    const infoSummary = document.getElementById('info-summary');
    const infoStats = document.getElementById('info-stats');
    const welcomePreset = document.getElementById('welcome-preset');
    const chatTabButton = document.getElementById('chat-tab-button');
    const tabButtons = document.querySelectorAll('.tab-button');
    const panels = document.querySelectorAll('.tab-panel');
    const tabBar = document.querySelector('.tab-bar');
    const linksTabButton = document.querySelector('.tab-button[data-tab="links"]');
    const infoTabButton = document.querySelector('.tab-button[data-tab="info"]');
    const linksTabPanel = document.getElementById('links-tab');
    const infoTabPanel = document.getElementById('info-tab');
    const moreActions = document.getElementById('more-actions');
    const moreMenu = document.getElementById('more-menu');
    const menuFullpage = document.getElementById('menu-fullpage');

    const defaultStarterMessage = 'Choose one to get started.';
    const defaultStarterSuggestions = [
      'What can you help with?',
      'How do I get started?',
      'Show me examples.',
    ];

    const defaultLinks = [];

    const defaultInfo = null;

    let instructions = "You're a helpful assistant.";
    let siteID = "default";
    let variant = "v2";
    let title = 'Chat Widget';
    let starterMessage = defaultStarterMessage;
    let starterSuggestions = [...defaultStarterSuggestions];
    let quickLinks = [...defaultLinks];
    let hostInfo = defaultInfo;
    let expanded = false;
    const messages = [];

    const hasInfoContent = (value) => {
      if (!value || typeof value !== 'object') return false;
      const hasHeadline = typeof value.headline === 'string' && value.headline.trim().length > 0;
      const hasSummary = typeof value.summary === 'string' && value.summary.trim().length > 0;
      const hasStats = Array.isArray(value.stats) && value.stats.length > 0;
      return hasHeadline || hasSummary || hasStats;
    };

    function applyOptionalTabs() {
      const showLinks = Array.isArray(quickLinks) && quickLinks.length > 0;
      const showInfo = hasInfoContent(hostInfo);

      linksTabButton.style.display = showLinks ? '' : 'none';
      linksTabPanel.style.display = showLinks ? '' : 'none';
      infoTabButton.style.display = showInfo ? '' : 'none';
      infoTabPanel.style.display = showInfo ? '' : 'none';

      const visibleTabCount = [showLinks, showInfo].filter(Boolean).length + 1; // chat tab is always available
      tabBar.classList.toggle('single-tab', visibleTabCount <= 1);

      const activeTab = document.querySelector('.tab-button.active');
      if (activeTab && activeTab.style.display === 'none') {
        setActiveTab('chat');
      }
    }

    function renderQuickLinks(items = quickLinks) {
      linksList.innerHTML = '';
      if (!items.length) return;
      items.forEach(link => {
        const anchor = document.createElement('a');
        anchor.href = link.url || '#';
        anchor.target = "_blank";
        anchor.rel = "noreferrer";
        anchor.className = 'link-card';

        const title = document.createElement('h4');
        title.textContent = link.label || 'Quick link';
        anchor.appendChild(title);

        const desc = document.createElement('p');
        desc.textContent = link.description || 'Open in a new tab';
        anchor.appendChild(desc);

        linksList.appendChild(anchor);
      });
    }

    function renderInfo(data = hostInfo) {
      hostInfo = data && typeof data === 'object' ? data : null;

      if (!hostInfo) {
        infoHeadline.textContent = '';
        infoSummary.textContent = '';
        infoStats.innerHTML = '';
        return;
      }

      infoHeadline.textContent = hostInfo.headline || '';
      infoSummary.textContent = hostInfo.summary || '';

      infoStats.innerHTML = '';
      const stats = Array.isArray(hostInfo.stats) ? hostInfo.stats : [];
      stats.forEach(stat => {
        const tile = document.createElement('div');
        tile.className = 'info-stat';
        const value = document.createElement('strong');
        value.textContent = stat.value || stat.label || '-';
        tile.appendChild(value);
        const label = document.createElement('div');
        label.textContent = stat.label || 'Metric';
        tile.appendChild(label);
        infoStats.appendChild(tile);
      });
    }

    function renderWelcome() {
      welcomePreset.innerHTML = '';
      if (messages.length > 0) return;
      const container = document.createElement('div');
      container.style.textAlign = 'center';
      const message = document.createElement('p');
      message.style.margin = '0 0 0.3rem';
      message.style.color = 'var(--muted-text)';
      message.style.fontSize = '0.85rem';
      message.textContent = starterMessage;
      container.appendChild(message);
      const row = document.createElement('div');
      row.className = 'preset-row';
      starterSuggestions.slice(0, 3).forEach(q => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = q;
        btn.onclick = () => {
          input.value = q;
          form.dispatchEvent(new Event('submit', { cancelable: true }));
        };
        row.appendChild(btn);
      });
      container.appendChild(row);
      welcomePreset.appendChild(container);
    }

    function setActiveTab(name) {
      tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
      panels.forEach(panel => panel.classList.toggle('active', panel.id === `${name}-tab`));
      if (name === 'chat') {
        renderWelcome();
        input.focus();
      }
    }

    function addMsg(text, who = 'bot', loading = false) {
      renderWelcome();
      const bubble = document.createElement('div');
      bubble.className = `msg ${who}`;
      if (loading) {
        bubble.innerHTML = `<span class="loading-spinner"></span><span>${text}</span>`;
        bubble.classList.add('loading');
      } else {
        bubble.textContent = text;
      }
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addMsg(value, 'user');
      messages.push({ role: 'user', content: value });
      input.value = '';
      const loadingNode = addMsg('Thinking...', 'bot', true);
      try {
        const response = await fetch('/.netlify/functions/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, instructions })
        });
        const data = await response.json();
        const reply = data.reply || 'Sorry, something went wrong.';
        loadingNode.remove();
        addMsg(reply, 'bot');
        messages.push({ role: 'assistant', content: reply });
      } catch (error) {
        loadingNode.remove();
        addMsg('The chatbot could not connect. Please try again soon.', 'bot');
        console.error(error);
      }
    });

    tabButtons.forEach(button => {
      button.addEventListener('click', () => setActiveTab(button.dataset.tab));
    });

    const setExpanded = (next) => {
      expanded = next;
      window.parent.postMessage({ type: 'chat-advanced-v2-expand', payload: { expanded } }, '*');
    };

    const updateFullpageMenuLabel = () => {
      menuFullpage.textContent = expanded ? 'Exit full page' : 'Enter full page';
    };

    const toggleMenu = () => {
      moreMenu.style.display = moreMenu.style.display === 'flex' ? 'none' : 'flex';
    };

    moreActions.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleMenu();
    });

    moreMenu.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    menuFullpage.addEventListener('click', () => {
      setExpanded(!expanded);
      updateFullpageMenuLabel();
      moreMenu.style.display = 'none';
    });

    document.addEventListener('click', () => {
      moreMenu.style.display = 'none';
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'chat-config-v2') {
        const payload = data.payload || {};
        instructions = payload.instructions || instructions;
        siteID = payload.siteID || siteID;
        variant = payload.variant || variant;
        if (typeof payload.title === 'string') title = payload.title;
        if (typeof payload.starterMessage === 'string') starterMessage = payload.starterMessage;
        if (Array.isArray(payload.starterSuggestions)) {
          starterSuggestions = payload.starterSuggestions.slice(0, 3);
        }
        const accentColor = payload.accentColor;
        const theme = payload.theme || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.title = title;
        chatTabButton.textContent = title;
        if (accentColor) {
          document.documentElement.style.setProperty('--accent', accentColor);
          document.documentElement.style.setProperty('--primary', accentColor);
        }
        quickLinks = Array.isArray(payload.quickLinks) ? payload.quickLinks : [];
        renderQuickLinks(quickLinks);

        if (typeof payload.info === 'object' && payload.info !== null) {
          renderInfo(payload.info);
        } else {
          renderInfo(null);
        }
        applyOptionalTabs();
      }

        if (data.type === 'chat-advanced-expand-state') {
          expanded = !!data.payload?.expanded;
          updateFullpageMenuLabel();
        }

        if (data.type === 'chat-focus-input') {
          input.focus();
        }
    });

    renderQuickLinks();
    renderInfo();
    applyOptionalTabs();
    updateFullpageMenuLabel();
    renderWelcome();
    setActiveTab('chat');
  </script>
</body>

</html>
